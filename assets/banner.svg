<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .glow-orb-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      animation: floatOrb2 8s ease-in-out infinite alternate;
    }
    .data-stream {
      stroke-dasharray: 8, 12;
      animation: flowStream 4s linear infinite;
    }
    .cursor-blink {
      animation: blink 1.2s infinite;
    }
    .node-pulse {
      animation: pulseNode 3s ease-in-out infinite alternate;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(60px, 30px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-50px, -25px) scale(1.2); }
    }
    @keyframes flowStream {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseNode {
      0% { opacity: 0.4; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <g class="glow-orb-1" style="transform-origin: 200px 100px;">
    <circle cx="200" cy="100" r="180" fill="#38bdf8" filter="url(#neonGlow)" opacity="0.18" />
  </g>
  <g class="glow-orb-2" style="transform-origin: 1000px 320px;">
    <circle cx="1000" cy="320" r="220" fill="#a855f7" filter="url(#neonGlow)" opacity="0.15" />
  </g>

  <!-- Architectural Background Grid -->
  <rect width="1200" height="420" fill="url(#gridPattern)"/>

  <!-- Animated Dynamic Data/Connection Lines -->
  <path d="M 50,340 C 250,380 400,320 600,350 C 800,380 950,300 1150,330" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.45" class="data-stream" />
  <path d="M 50,80 C 300,40 500,120 750,70 C 950,20 1050,90 1150,60" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.35" class="data-stream" style="animation-duration: 6s;" />

  <!-- Collaborative Multi-cursor Simulation (Subtle Decorative Background Visuals) -->
  <g opacity="0.55" transform="translate(920, 85)">
    <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="17" r="5" fill="#38bdf8"/>
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">Dev Alice: Editing</text>
    <polygon points="12,1 12,12 16,9 20,13 22,11 18,7 23,7" fill="#38bdf8" transform="translate(-18, 12) scale(0.9)"/>
  </g>

  <g opacity="0.55" transform="translate(120, 310)">
    <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
    <circle cx="16" cy="17" r="5" fill="#f472b6"/>
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" font-weight="600">Dev Bob: Container live</text>
    <polygon points="12,1 12,12 16,9 20,13 22,11 18,7 23,7" fill="#f472b6" transform="translate(-18, 12) scale(0.9)"/>
  </g>

  <!-- Central Foreground Content Card (Ensuring Title and Subtitle are completely clear) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(425, 42)">
      <rect width="350" height="32" rx="16" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
      <text x="175" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e0e7ff" text-anchor="middle" letter-spacing="1.2">
        ⚡ CLOUD DEVELOPMENT ENVIRONMENTS &amp; IDES
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 4px 14px rgba(0, 0, 0, 0.7))">
      Collaborative Coding &amp; Cloud IDEs
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2">
      The Curated Matrix of Browser Sandboxes, Remote CDEs, &amp; Multiplayer Editors
    </text>

    <!-- Interactive Terminal Command Box -->
    <g transform="translate(360, 225)">
      <rect width="480" height="42" rx="10" fill="#0b1120" stroke="#334155" stroke-width="1.4" opacity="0.95" />
      <circle cx="20" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
      <circle cx="36" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="52" cy="21" r="5" fill="#10b981" opacity="0.8"/>
      <text x="75" y="26" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#38bdf8" font-weight="500">
        git clone https://github.com/ishandutta2007/...
      </text>
      <rect x="445" y="12" width="8" height="18" fill="#38bdf8" class="cursor-blink" />
    </g>

    <!-- Feature Architecture Pills (Foreground Bottom) -->
    <g transform="translate(230, 310)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
        <text x="82" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bae6fd" text-anchor="middle">
          🌐 WebContainers
        </text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9"/>
        <text x="82" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0e7ff" text-anchor="middle">
          👥 Real-Time Pair
        </text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(370, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9"/>
        <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f3e8ff" text-anchor="middle">
          🐳 Docker &amp; DevContainers
        </text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(570, 0)">
        <rect width="170" height="36" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" opacity="0.9"/>
        <text x="85" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fce7f3" text-anchor="middle">
          🤖 AI Coding Agents
        </text>
      </g>
    </g>
  </g>
</svg>
